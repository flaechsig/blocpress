apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: blocpress-db
spec:
  serviceName: blocpress-db
  replicas: 1
  selector:
    matchLabels: {app: blocpress-db}
  template:
    metadata:
      labels: {app: blocpress-db}
    spec:
      containers:
        - name: postgres
          image: postgres:18
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: blocpress-db, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: blocpress-db, key: password}}
          ports: [{containerPort: 5432}]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 512Mi}
          readinessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d production']}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
      volumes:
        - name: init
          configMap: {name: blocpress-db-init}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: blocpress-db
spec:
  selector: {app: blocpress-db}
  ports: [{port: 5432}]
