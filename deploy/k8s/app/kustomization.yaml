# blocpress ohne Datenbank: render, workbench, studio und Elasticsearch.
# Erwartet die Datenbanken "workbench" und "production" unter blocpress-db:5432 und das Secret
# "blocpress-db" (Schluessel username, password). Die Tabellen legen die Dienste selbst an.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs: {app.kubernetes.io/part-of: blocpress}
resources:
  - elasticsearch.yaml
  - render.yaml
  - workbench.yaml
  - studio.yaml
images:
  # Version setzt der Release-Workflow
  - {name: flaechsig/blocpress-render, newTag: "2.7.1"}
  - {name: flaechsig/blocpress-workbench, newTag: "2.7.1"}
  - {name: flaechsig/blocpress-studio, newTag: "2.7.1"}
