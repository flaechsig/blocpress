# studio: Portal im Browser, einziger oeffentlicher Einstieg; leitet /api und /proxy an die
# Workbench weiter.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blocpress-studio
spec:
  replicas: 1
  selector:
    matchLabels: {app: blocpress-studio}
  template:
    metadata:
      labels: {app: blocpress-studio}
    spec:
      # REQ-0051: kein root, keine Rechteausweitung (die blocpress-Images laufen als UID 10001)
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: studio
          image: flaechsig/blocpress-studio
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # REQ-0052: geschrieben wird nur nach /tmp
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}   # HOME und Temp-Dateien
          env:
            - {name: WORKBENCH_URL, value: "http://blocpress-workbench:8081"}
          ports: [{containerPort: 8082}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 256Mi}
          readinessProbe:
            httpGet: {path: /q/health/ready, port: 8082}
          livenessProbe:
            httpGet: {path: /q/health/live, port: 8082}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: blocpress-studio
spec:
  selector: {app: blocpress-studio}
  ports: [{port: 8082}]
