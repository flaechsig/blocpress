# render: Dokumente erzeugen. Standardgroesse nach docs/guides/render-sizing.md (2 CPU, 640Mi);
# die Zahl der LibreOffice-Worker leitet render aus dem CPU-Limit ab. Mehr Last: mehr Replicas.
# /api/render/templates/import ist nur fuer die Workbench gedacht. Ohne BLOCPRESS_AUTH_ENABLED=true
# ist er offen — render dann nicht ungefiltert nach aussen freigeben; eingeschaltet verlangt er ein
# Token mit der Gruppe reviewer (ADR-0019).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blocpress-render
spec:
  replicas: 1
  selector:
    matchLabels: {app: blocpress-render}
  template:
    metadata:
      labels: {app: blocpress-render}
    spec:
      # REQ-0051: kein root, keine Rechteausweitung (die blocpress-Images laufen als UID 10001)
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # wartet, bis die Datenbank Verbindungen annimmt; sonst bricht Liquibase beim Start ab
        - name: wait-for-db
          image: postgres:18
          securityContext:
            runAsUser: 999                 # Benutzer postgres im Image, sonst root
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          command: [sh, -c, 'until pg_isready -h blocpress-db -p 5432; do sleep 2; done']
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
      containers:
        - name: render
          image: flaechsig/blocpress-render
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # REQ-0052: geschrieben wird nur nach /tmp
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}   # HOME, Temp-Dateien, LibreOffice-Profile
          env:
            - {name: QUARKUS_DATASOURCE_JDBC_URL, value: "jdbc:postgresql://blocpress-db:5432/production"}
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: blocpress-db, key: username}}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: blocpress-db, key: password}}
            - {name: BLOCPRESS_DEFAULT_LOCALE, value: de-DE}
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: "2", memory: 640Mi}
            limits: {cpu: "2", memory: 640Mi}
          startupProbe:
            httpGet: {path: /q/health/started, port: 8080}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /q/health/ready, port: 8080}
          livenessProbe:
            httpGet: {path: /q/health/live, port: 8080}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: blocpress-render
spec:
  selector: {app: blocpress-render}
  ports: [{port: 8080}]
