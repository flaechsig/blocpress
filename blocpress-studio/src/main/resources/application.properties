quarkus.http.port=8082

# URL of the workbench server — used by WorkbenchProxyResource to fetch bp-workbench.js.
# Override via env var: WORKBENCH_URL=http://blocpress-workbench:8082
workbench.url=${WORKBENCH_URL:http://localhost:8082}

# Disable immutable caching for static JS/HTML files so that a container
# rebuild is immediately visible without requiring a browser hard-refresh.
quarkus.http.static-resources.caching-enabled=false

# Access log so we can see which requests hit studio
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern="%r" %s %b

# Security-Header (REQ-0065, REQ-0066). Der Hash in script-src gibt die Import-Map der
# Startseite frei; aendert sie sich, muss er mitgezogen werden (SecurityHeadersTest).
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."Content-Security-Policy".value=default-src 'self'; script-src 'self' https://esm.sh 'sha256-YGGHGr5Re0q4n0ZqMq2C1kySwQkkM2Z22ncapHS3eKQ='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob:; frame-src 'self' blob:; object-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'
