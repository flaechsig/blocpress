quarkus.http.port=8082

# URL of the workbench server — used by WorkbenchProxyResource to fetch bp-workbench.js.
# Override via env var: WORKBENCH_URL=http://blocpress-workbench:8082
workbench.url=${WORKBENCH_URL:http://localhost:8082}

# Disable immutable caching for static JS/HTML files so that a container
# rebuild is immediately visible without requiring a browser hard-refresh.
quarkus.http.static-resources.caching-enabled=false

# Access log so we can see which requests hit studio
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern="%r" %s %b
