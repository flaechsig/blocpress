[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
loglevel=info
user=root

; -----------------------------------------------------------------------
; Elasticsearch — Full-text search engine  (internal port 9200)
; Starts first (priority=5) — workbench waits for it to be ready
; -----------------------------------------------------------------------
[program:elasticsearch]
command=su -s /bin/bash elasticsearch -c "/opt/elasticsearch/bin/elasticsearch"
environment=
    ES_JAVA_OPTS="-Xms256m -Xmx256m",
    HOME="/opt/elasticsearch"
stdout_logfile=/var/log/supervisor/elasticsearch.log
stdout_logfile_maxbytes=20MB
stderr_logfile=/var/log/supervisor/elasticsearch.log
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startretries=3
startsecs=20
priority=5

; -----------------------------------------------------------------------
; blocpress-studio    — Landing page + router  (port 8080, public)
; -----------------------------------------------------------------------
[program:studio]
command=/bin/bash -c "exec java ${JAVA_OPTS_STUDIO:-} -jar quarkus-run.jar"
directory=/app/studio
environment=
    QUARKUS_HTTP_PORT="8080",
    WORKBENCH_URL="http://localhost:8082"
stdout_logfile=/var/log/supervisor/studio.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/supervisor/studio.log
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startretries=5
startsecs=10

; -----------------------------------------------------------------------
; blocpress-workbench — Workbench UI  (internal port 8082, via studio)
; -----------------------------------------------------------------------
[program:workbench]
command=/bin/bash -c "until curl -sf http://localhost:9200/_cluster/health > /dev/null 2>&1; do echo '[workbench] Waiting for Elasticsearch...'; sleep 3; done && exec java ${JAVA_OPTS_WORKBENCH:-} -jar quarkus-run.jar"
directory=/app/workbench
environment=
    QUARKUS_HTTP_PORT="8082",
    QUARKUS_DATASOURCE_JDBC_URL="jdbc:postgresql://localhost:5432/workbench",
    QUARKUS_DATASOURCE_USERNAME="blocpress",
    QUARKUS_DATASOURCE_PASSWORD="blocpress",
    RENDER_URL="http://localhost:8081",
    QUARKUS_HIBERNATE_ORM_SCHEMA_MANAGEMENT_STRATEGY="update",
    ELASTICSEARCH_HOSTS="localhost:9200"
stdout_logfile=/var/log/supervisor/workbench.log
stdout_logfile_maxbytes=20MB
stderr_logfile=/var/log/supervisor/workbench.log
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startretries=5
startsecs=15

; -----------------------------------------------------------------------
; blocpress-render    — Render API  (port 8081, public)
; -----------------------------------------------------------------------
[program:render]
command=/bin/bash -c "exec java ${JAVA_OPTS_RENDER:-} -jar quarkus-run.jar"
directory=/app/render
environment=
    QUARKUS_HTTP_PORT="8081",
    QUARKUS_DATASOURCE_JDBC_URL="jdbc:postgresql://localhost:5432/production",
    QUARKUS_DATASOURCE_USERNAME="blocpress",
    QUARKUS_DATASOURCE_PASSWORD="blocpress",
    QUARKUS_HIBERNATE_ORM_SCHEMA_MANAGEMENT_STRATEGY="update"
stdout_logfile=/var/log/supervisor/render.log
stdout_logfile_maxbytes=20MB
stderr_logfile=/var/log/supervisor/render.log
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startretries=5
startsecs=15
