name: Website

# Veröffentlicht die Website aus site/ auf GitHub Pages.
# Voraussetzung: In den Repository-Einstellungen ist als Quelle für Pages
# "GitHub Actions" gewählt.

on:
  push:
    branches: [main]
    paths: ['site/**']
  # Der Release pusht mit dem Standard-Token; solche Pushes starten keine
  # Workflows. Daher nach jedem erfolgreichen Release neu veröffentlichen (US-0047).
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
