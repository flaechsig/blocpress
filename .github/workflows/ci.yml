name: CI

on:
  push:
    branches: [ "main", "workbench-*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # PDF/RTF-Konvertierung (REQ-0004): render-Tests brauchen soffice, und ohne
      # LibreOffice wird core-TransformTest uebersprungen -> req-check-Gate rot.
      - name: Install LibreOffice (headless)
        # apt-Spiegel haengen gelegentlich (2026-10-02: >20 min) — lieber sauber abbrechen
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui poppler-utils

      # Unit- + Integrationstests aller Module ausser e2e (braucht das gebaute
      # Quickstart-Image). render/studio-ITs sind per Default aus (skipITs=true).
      # blocpress-req-check laeuft als letztes Modul und prueft die Traceability.
      - name: Build, test and traceability gate
        run: mvn -B clean verify -pl blocpress-req-trace,blocpress-core,blocpress-render,blocpress-workbench,blocpress-studio,blocpress-req-check
        env:
          # Testcontainers needs Docker socket
          TESTCONTAINERS_RYUK_DISABLED: "true"
