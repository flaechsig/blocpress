name: CI

on:
  push:
    branches: [ "main", "workbench-*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and unit-test
        run: mvn clean test -pl blocpress-core,blocpress-workbench

      - name: Integration tests (workbench, requires Docker)
        run: mvn verify -pl blocpress-core,blocpress-workbench -DskipUTs
        env:
          # Testcontainers needs Docker socket
          TESTCONTAINERS_RYUK_DISABLED: "true"
