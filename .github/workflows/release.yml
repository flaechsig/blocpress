name: Release

# Trigger: GitHub UI → Actions → Release → "Run workflow"
# Input: version (e.g. 2.3.0) and next_version (e.g. 2.4.0)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release-Version (z.B. 2.3.0)'
        required: true
      next_version:
        description: 'Nächste Entwicklungsversion ohne -SNAPSHOT (z.B. 2.4.0)'
        required: true

jobs:
  release:
    name: Release v${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push commits + tags + create GitHub Release

    steps:
      # ------------------------------------------------------------------
      # Checkout & Tools
      # ------------------------------------------------------------------
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # vollständige History für den Merge

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Git-Konfiguration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ------------------------------------------------------------------
      # Version setzen & committen (pom.xml + Landing Page)
      # ------------------------------------------------------------------
      - name: Version auf ${{ inputs.version }} setzen
        run: mvn versions:set -DnewVersion=${{ inputs.version }} -DgenerateBackupPoms=false

      - name: Landing Page aktualisieren
        run: |
          OLD=$(grep -oP '"softwareVersion": "\K[^"]+' site/index.html | head -1)
          sed -i "s/\"softwareVersion\": \"${OLD}\"/\"softwareVersion\": \"${{ inputs.version }}\"/g" site/index.html
          sed -i "s/>v${OLD}</>v${{ inputs.version }}</g" site/index.html

      - name: Kubernetes-Manifeste und Sysadmin-Tutorial auf die Version setzen
        run: |
          sed -i -E "s/(name: flaechsig\/blocpress-(render|workbench|studio), newTag: )\"[^\"]+\"/\1\"${{ inputs.version }}\"/" deploy/k8s/app/kustomization.yaml
          sed -i -E "s/deploy\/k8s\?ref=v[0-9.]+/deploy\/k8s?ref=v${{ inputs.version }}/g" site/tutorial-sysadmin.html
          grep -c "newTag: \"${{ inputs.version }}\"" deploy/k8s/app/kustomization.yaml | grep -qx 3

      - name: Version committen
        run: |
          git add -A
          git commit -m "release: v${{ inputs.version }}"

      # ------------------------------------------------------------------
      # Build & Test
      # ------------------------------------------------------------------
      # Wie ci.yml: LibreOffice fuer die PDF/RTF-Tests (REQ-0004), Reactor inkl.
      # Danach prueft docspine Doku und Testberichte aller Module.
      - name: Install LibreOffice (headless)
        # apt-Spiegel haengen gelegentlich (2026-10-02: >20 min) — lieber sauber abbrechen
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui poppler-utils imagemagick

      - name: Build und Tests
        run: mvn -B clean verify -pl blocpress-core,blocpress-render,blocpress-workbench,blocpress-studio
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: docspine check
        run: python3 .docspine/docspine.pyz check

      # ------------------------------------------------------------------
      # Native-Binaries bauen (GraalVM/Mandrel-Container-Build) — BEWUSST VOR
      # dem Maven-Central-Deploy: schlaegt der native Build fehl, ist noch
      # nichts Unwiderrufliches passiert. Erzeugt die *-runner-Binaries fuer
      # das native Quickstart-Image.
      # ------------------------------------------------------------------
      - name: Native-Binaries bauen
        run: >
          mvn clean package -Dnative
          -pl blocpress-studio,blocpress-render,blocpress-workbench
          --also-make
          -DskipTests

      # ------------------------------------------------------------------
      # E2E-Gate: Quickstart-Image (nativ) lokal bauen und die E2E-Suite
      # dagegen laufen lassen — VOR Docker Hub und Maven Central. Schlaegt
      # sie fehl, wird nichts veroeffentlicht.
      # ------------------------------------------------------------------
      - name: Quickstart-Image lokal bauen (für E2E)
        run: docker build -f docker/studio/Dockerfile.native -t blocpress-studio-quickstart:e2e .

      - name: E2E-Suite gegen das Quickstart-Image
        run: >
          mvn -B verify -pl blocpress-e2e
          -De2e.skip=false
          -Dstudio.image=blocpress-studio-quickstart:e2e
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      # ------------------------------------------------------------------
      # Docker Hub — natives Quickstart-Image (GraalVM-Binaries, kein JRE)
      # ------------------------------------------------------------------
      - name: Docker Hub Login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Buildx einrichten (docker-container driver für GHA-Cache)
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Quickstart-Image bauen und pushen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/studio/Dockerfile.native
          push: true
          tags: |
            flaechsig/blocpress-studio-quickstart:${{ inputs.version }}
            flaechsig/blocpress-studio-quickstart:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Einzel-Modul-Images (native). Nutzen die in "Native-Binaries bauen"
      # erzeugten *-runner-Binaries via dem jeweiligen Dockerfile.native.
      - name: render-Image bauen und pushen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: blocpress-render
          file: blocpress-render/Dockerfile.native
          push: true
          tags: |
            flaechsig/blocpress-render:${{ inputs.version }}
            flaechsig/blocpress-render:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: workbench-Image bauen und pushen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: blocpress-workbench
          file: blocpress-workbench/Dockerfile.native
          push: true
          tags: |
            flaechsig/blocpress-workbench:${{ inputs.version }}
            flaechsig/blocpress-workbench:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: studio-Image bauen und pushen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: blocpress-studio
          file: blocpress-studio/Dockerfile.native
          push: true
          tags: |
            flaechsig/blocpress-studio:${{ inputs.version }}
            flaechsig/blocpress-studio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker Hub README Quickstart aktualisieren
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4.0.2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: flaechsig/blocpress-studio-quickstart
          readme-filepath: docker/README.quickstart.md

      - name: Docker Hub README render aktualisieren
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4.0.2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: flaechsig/blocpress-render
          readme-filepath: docker/README.md

      # ------------------------------------------------------------------
      # Tag setzen & Branch in main mergen
      # ------------------------------------------------------------------
      - name: Commit + Tag pushen
        run: |
          git push origin HEAD
          git tag v${{ inputs.version }}
          git push origin v${{ inputs.version }}

      # ------------------------------------------------------------------
      # Maven Central — nur blocpress-core. BEWUSST als letzte Veröffentlichung
      # (US-0047): Central lässt sich nicht zurücknehmen; Images lassen sich
      # überschreiben, der Tag löschen. HEAD ist hier genau der getaggte Commit.
      # ------------------------------------------------------------------
      - name: GPG-Key importieren
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: blocpress-core nach Maven Central deployen
        run: >
          mvn deploy
          -pl blocpress-core
          --also-make
          -Prelease
          -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: In main mergen
        if: ${{ github.ref_name != 'main' }}
        run: |
          BRANCH="${{ github.ref_name }}"
          git checkout main
          git pull origin main
          git merge --no-ff "$BRANCH" -m "Merge '$BRANCH' — Release v${{ inputs.version }}"
          git push origin main

      - name: Branch löschen
        if: ${{ github.ref_name != 'main' }}
        run: git push origin --delete ${{ github.ref_name }}

      # ------------------------------------------------------------------
      # Nächste Entwicklungsversion auf main vorbereiten
      # ------------------------------------------------------------------
      - name: Version auf ${{ inputs.next_version }}-SNAPSHOT setzen
        run: mvn versions:set -DnewVersion=${{ inputs.next_version }}-SNAPSHOT -DgenerateBackupPoms=false

      - name: Nächste Version committen
        run: |
          git add -A
          git commit -m "chore: prepare v${{ inputs.next_version }}-SNAPSHOT"
          git push origin main

      # ------------------------------------------------------------------
      # GitHub Release aus CHANGELOG erstellen
      # ------------------------------------------------------------------
      - name: Release-Notes aus CHANGELOG extrahieren
        id: notes
        run: |
          VERSION="${{ inputs.version }}"
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          {
            echo "content<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ inputs.version }}
          name: "blocpress v${{ inputs.version }}"
          body: ${{ steps.notes.outputs.content }}
