name: Release

# Triggered by pushing a version tag, e.g. git tag v2.2.0 && git push --tags
on:
  push:
    tags:
      - 'v*'

jobs:
  # -------------------------------------------------------------------------
  # 1. Build & test everything
  # -------------------------------------------------------------------------
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Extract version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build all modules (skip tests for speed — tests ran on CI)
        run: mvn clean package -DskipTests

      - name: Upload workbench artifact
        uses: actions/upload-artifact@v4
        with:
          name: quarkus-apps
          path: |
            blocpress-workbench/target/quarkus-app/
            blocpress-render/target/quarkus-app/
            blocpress-studio/target/quarkus-app/
          retention-days: 1

  # -------------------------------------------------------------------------
  # 2. Publish blocpress-core to Maven Central
  #    (blocpress-core is the shared library — the only artifact consumers need)
  # -------------------------------------------------------------------------
  publish-maven:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: build
    environment: release   # optional: require manual approval in GitHub UI

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21 with Maven Central server
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          # Injects <server id="central"> into ~/.m2/settings.xml
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Deploy blocpress-core to Maven Central
        # --also-make builds the parent POM first (required for dependency resolution)
        # -Prelease activates GPG signing + central-publishing-maven-plugin
        run: >
          mvn deploy
          -pl blocpress-core
          --also-make
          -Prelease
          -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  # -------------------------------------------------------------------------
  # 3. Build & push Docker image to Docker Hub
  # -------------------------------------------------------------------------
  publish-docker:
    name: Push Docker image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build all Quarkus apps
        run: mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/studio/Dockerfile
          push: true
          tags: |
            flaechsig/blocpress-studio-quickstart:${{ needs.build.outputs.version }}
            flaechsig/blocpress-studio-quickstart:latest
          # Layer caching via GitHub Actions cache
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # 4. Create GitHub Release with CHANGELOG excerpt
  # -------------------------------------------------------------------------
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [ publish-maven, publish-docker ]
    permissions:
      contents: write   # required to create a release

    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG.md
        id: notes
        # Extracts the block between the first "## [x.y.z]" heading and the next one
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          {
            echo "content<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "blocpress ${{ github.ref_name }}"
          body: ${{ steps.notes.outputs.content }}
          draft: false
          prerelease: false
