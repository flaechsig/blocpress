name: Release

# Trigger: GitHub UI → Actions → Release → "Run workflow"
# Input: version (e.g. 2.3.0) and next_version (e.g. 2.4.0)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release-Version (z.B. 2.3.0)'
        required: true
      next_version:
        description: 'Nächste Entwicklungsversion ohne -SNAPSHOT (z.B. 2.4.0)'
        required: true

jobs:
  release:
    name: Release v${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push commits + tags + create GitHub Release

    steps:
      # ------------------------------------------------------------------
      # Checkout & Tools
      # ------------------------------------------------------------------
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # vollständige History für den Merge

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Git-Konfiguration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ------------------------------------------------------------------
      # Version setzen & committen (pom.xml + Landing Page)
      # ------------------------------------------------------------------
      - name: Version auf ${{ inputs.version }} setzen
        run: mvn versions:set -DnewVersion=${{ inputs.version }} -DgenerateBackupPoms=false

      - name: Landing Page aktualisieren
        run: |
          OLD=$(grep -oP '"softwareVersion": "\K[^"]+' docs/index.html | head -1)
          sed -i "s/\"softwareVersion\": \"${OLD}\"/\"softwareVersion\": \"${{ inputs.version }}\"/g" docs/index.html
          sed -i "s/>v${OLD}</>v${{ inputs.version }}</g" docs/index.html

      - name: Version committen
        run: |
          git add -A
          git commit -m "release: v${{ inputs.version }}"

      # ------------------------------------------------------------------
      # Build & Test
      # ------------------------------------------------------------------
      - name: Build & Unit-Tests
        run: mvn clean test -pl blocpress-core,blocpress-workbench

      - name: Integration-Tests
        run: mvn verify -pl blocpress-core,blocpress-workbench -DskipUTs
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      # ------------------------------------------------------------------
      # Maven Central — nur blocpress-core
      # ------------------------------------------------------------------
      - name: GPG-Key importieren
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: blocpress-core nach Maven Central deployen
        run: >
          mvn deploy
          -pl blocpress-core
          --also-make
          -Prelease
          -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # ------------------------------------------------------------------
      # Docker Hub — Quickstart-Image
      # ------------------------------------------------------------------
      - name: Alle Module bauen (für Docker-Image)
        run: mvn clean package -DskipTests

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker-Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/studio/Dockerfile
          push: true
          tags: |
            flaechsig/blocpress-studio-quickstart:${{ inputs.version }}
            flaechsig/blocpress-studio-quickstart:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker Hub README aktualisieren
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: flaechsig/blocpress-studio-quickstart
          readme-filepath: docs/dockerhub.md

      # ------------------------------------------------------------------
      # Tag setzen & Branch in main mergen
      # ------------------------------------------------------------------
      - name: Commit + Tag pushen
        run: |
          git push origin HEAD
          git tag v${{ inputs.version }}
          git push origin v${{ inputs.version }}

      - name: In main mergen
        run: |
          BRANCH="${{ github.ref_name }}"
          git checkout main
          git pull origin main
          git merge --no-ff "$BRANCH" -m "Merge '$BRANCH' — Release v${{ inputs.version }}"
          git push origin main

      - name: Branch löschen
        run: git push origin --delete ${{ github.ref_name }}

      # ------------------------------------------------------------------
      # Nächste Entwicklungsversion auf main vorbereiten
      # ------------------------------------------------------------------
      - name: Version auf ${{ inputs.next_version }}-SNAPSHOT setzen
        run: mvn versions:set -DnewVersion=${{ inputs.next_version }}-SNAPSHOT -DgenerateBackupPoms=false

      - name: Nächste Version committen
        run: |
          git add -A
          git commit -m "chore: prepare v${{ inputs.next_version }}-SNAPSHOT"
          git push origin main

      # ------------------------------------------------------------------
      # GitHub Release aus CHANGELOG erstellen
      # ------------------------------------------------------------------
      - name: Release-Notes aus CHANGELOG extrahieren
        id: notes
        run: |
          VERSION="${{ inputs.version }}"
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          {
            echo "content<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: "blocpress v${{ inputs.version }}"
          body: ${{ steps.notes.outputs.content }}
