quarkus.swagger-ui.always-include=true

# --- CORS ---
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*

# --- JWT Authentication (TI-4) ---
# DISABLED FOR DEV - remove this for production
# Defaults use the built-in dev key. Override via environment variables:
#   MP_JWT_VERIFY_PUBLICKEY=<PEM string>
#   MP_JWT_VERIFY_ISSUER=<issuer URL>
# mp.jwt.verify.
# mp.jwt.verify.issuer=https://blocpress.dev
# smallrye.jwt.path.groups=groups

# --- Database Configuration (TI-2: production schema) ---
# With TI-2, templates are imported into the local production schema
# Uses same PostgreSQL instance as workbench but with separate "production" schema
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/production}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:workbench}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:workbench}
quarkus.hibernate-orm.schema-management.strategy=validate

# --- Template Cache Configuration (UC-10 + TI-2) ---
# Caches template content from the local production schema
quarkus.cache.enabled=true
quarkus.cache.type=caffeine
quarkus.cache.caffeine."templates".maximum-size=100
quarkus.cache.caffeine."templates".expire-after-write=10M

# --- Security Configuration ---
# Internal endpoints (no authentication required)
quarkus.http.auth.permission.internal.paths=/api/render/templates/import,/api/render/templates/import/*
quarkus.http.auth.permission.internal.policy=permit

# --- LibreOffice-Konvertierung (CLI) ---
# Maximale Anzahl gleichzeitiger soffice-Konvertierungen (Throttling, je eigenes Profil)
blocpress.libreoffice.workers=${BLOCPRESS_LO_WORKERS:2}

# --- Async Rendering (UC-23) ---
# Polling-Intervall des Workers (ISO-8601 Duration oder Quarkus-Shorthand)
blocpress.async.poll-interval=${BLOCPRESS_ASYNC_POLL_INTERVAL:2s}
# Dauer bis die generierten Dokument-Bytes gelöscht werden (Datensatz bleibt)
blocpress.async.result-retention=${BLOCPRESS_ASYNC_RESULT_RETENTION:PT24H}
# Dauer bis der gesamte Job-Datensatz gelöscht wird
blocpress.async.record-retention=${BLOCPRESS_ASYNC_RECORD_RETENTION:P7D}

# Internal endpoints (no authentication required) — also async jobs API
quarkus.http.auth.permission.async.paths=/api/render/jobs/*,/api/render/dashboard,/api/render/dashboard/*
quarkus.http.auth.permission.async.policy=permit

# HTTP Logging for debugging
quarkus.log.category."org.jboss.resteasy.reactive".level=DEBUG
quarkus.log.category."io.github.flaechsig.blocpress.render".level=DEBUG

# --- Sprache fuer Zahlen- und Datumsformate ---
# Ersatzsprache (BCP-47, z.B. de-DE, en-US) fuer Number-/Date-Styles der Vorlage, die selbst
# keine Sprache angeben. Eine Sprache im Style (number:language/country) hat Vorrang.
# Wird beim Start gegen die im Image vorhandenen Sprachdaten geprueft (Abbruch, wenn sie fehlen).
blocpress.render.default-locale=${BLOCPRESS_DEFAULT_LOCALE:de-DE}

# --- GraalVM Native Image ---
# Sprachdaten fuer DecimalFormatSymbols/DateTimeFormatter ins Native-Image einbinden. Ohne diese
# Einstellung enthaelt das Image nur die Build-Locale; alle anderen Sprachen fallen stillschweigend
# auf das Root-/en-Format zurueck (Regression 2.5.0: 500,000 statt 500.000). Wirkt nur im Native-Build.
quarkus.locales=all
# commons-compress (via odfdom) referenziert optionale Codecs (zstd, brotli, ...),
# deren native Libs nicht im Classpath sind. ODT nutzt nur ZIP/Deflate, daher die
# optionalen Compressor-Klassen erst zur Laufzeit initialisieren.
quarkus.native.additional-build-args=--initialize-at-run-time=org.apache.commons.compress.compressors
