quarkus.swagger-ui.always-include=true

# --- CORS (F-07) ---
# Browser rufen die Dienste nur same-origin auf (das Studio leitet alles weiter). Fremde
# Origins nur ausdruecklich, kommagetrennt: BLOCPRESS_CORS_ORIGINS=https://portal.example
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${BLOCPRESS_CORS_ORIGINS:}

# --- JWT-Authentifizierung (ADR-002, REQ-0008/0009) ---
# Optional, Default aus (bestehende Integrationen ohne Token brechen nicht). Eingeschaltet
# verlangen alle Render-, Job- und Dashboard-Endpunkte unter /api/render/ ein gueltiges
# Bearer-Token, der Import zusaetzlich die Gruppe reviewer (permission "import"); /q/* bleibt offen.
# Schluessel: MP_JWT_VERIFY_PUBLICKEY oder MP_JWT_VERIFY_PUBLICKEY_LOCATION,
# Issuer: MP_JWT_VERIFY_ISSUER. Ohne Schluessel bricht der Start ab (RenderAuthConfig).
blocpress.auth.enabled=${BLOCPRESS_AUTH_ENABLED:false}
quarkus.http.auth.permission.render-api.paths=/api/render/*
quarkus.http.auth.permission.render-api.policy=authenticated
quarkus.http.auth.permission.render-api.enabled=${blocpress.auth.enabled}
# Nur authentifizieren, wo eine Berechtigung es verlangt: bei ausgeschaltetem JWT wird ein
# mitgeschicktes Token ignoriert statt (ohne Schluessel) zu einem 401 zu fuehren.
quarkus.http.auth.proactive=false

# --- Database Configuration (TI-2: production schema) ---
# With TI-2, templates are imported into the local production schema
# Uses same PostgreSQL instance as workbench but with separate "production" schema
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/production}
%dev.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/production}
# Tests: keine URL -> Quarkus DevServices startet eine PostgreSQL (Docker); jeder Start beginnt
# mit leerer Datenbank und laeuft durch alle Changesets
%test.quarkus.liquibase.clean-at-start=true
# JaCoCo: quarkus-jacoco schreibt die Abdeckung der @QuarkusTests (wird mit jacoco-*.exec zusammengefuehrt)
%test.quarkus.jacoco.data-file=target/jacoco-quarkus.exec
%test.quarkus.jacoco.reuse-data-file=true
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:workbench}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:workbench}
# Schema: Liquibase-Changesets unter db/ beim Start, Hibernate prueft nur (US-0052).
quarkus.liquibase.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# --- Template Cache Configuration (UC-10 + TI-2) ---
# Caches template content from the local production schema
quarkus.cache.enabled=true
quarkus.cache.type=caffeine
# Inhalt je Version (id); welche Version gilt, ermittelt render bei jedem Rendern neu (REQ-0063).
# Der Inhalt einer id aendert sich nicht, die Grenzen begrenzen nur den Speicher.
quarkus.cache.caffeine."template-content".maximum-size=300
quarkus.cache.caffeine."template-content".expire-after-access=1H

# --- Import in die Produktion (ADR-0019, REQ-0054/0055) ---
# Eingeschaltet verlangt der Import (POST/DELETE) ein Token mit der Gruppe reviewer
# (groups-Claim): ohne Token 401, ohne Rolle 403. Die Workbench reicht das Token des
# Benutzers durch. Ausgeschaltet greift keine Berechtigung, der Import bleibt offen.
quarkus.http.auth.policy.reviewer.roles-allowed=reviewer
quarkus.http.auth.permission.import.paths=/api/render/templates/import,/api/render/templates/import/*
quarkus.http.auth.permission.import.policy=reviewer
quarkus.http.auth.permission.import.enabled=${blocpress.auth.enabled}

# --- LibreOffice-Konvertierung (CLI) ---
# Gleichzeitige soffice-Konvertierungen: das CPU-Kontingent (abgerundet, mindestens 1).
# BLOCPRESS_LO_WORKERS ist eine Obergrenze, etwa bei knappem Speicher (~150 MiB je Worker).
blocpress.libreoffice.workers=${BLOCPRESS_LO_WORKERS:}

# --- Async Rendering (UC-23) ---
# Polling-Intervall des Workers (ISO-8601 Duration oder Quarkus-Shorthand)
blocpress.async.poll-interval=${BLOCPRESS_ASYNC_POLL_INTERVAL:2s}
# Dauer bis die generierten Dokument-Bytes gelöscht werden (Datensatz bleibt)
blocpress.async.result-retention=${BLOCPRESS_ASYNC_RESULT_RETENTION:PT24H}
# Dauer bis der gesamte Job-Datensatz gelöscht wird
blocpress.async.record-retention=${BLOCPRESS_ASYNC_RECORD_RETENTION:P7D}
# Jobs, die länger PROCESSING sind (Instanz abgestürzt), gehen zurück auf PENDING
blocpress.async.stale-after=${BLOCPRESS_ASYNC_STALE_AFTER:PT10M}


# HTTP Logging for debugging
quarkus.log.category."org.jboss.resteasy.reactive".level=DEBUG
quarkus.log.category."io.github.flaechsig.blocpress.render".level=DEBUG

# --- Sprache fuer Zahlen- und Datumsformate ---
# Ersatzsprache (BCP-47, z.B. de-DE, en-US) fuer Number-/Date-Styles der Vorlage, die selbst
# keine Sprache angeben. Eine Sprache im Style (number:language/country) hat Vorrang.
# Wird beim Start gegen die im Image vorhandenen Sprachdaten geprueft (Abbruch, wenn sie fehlen).
blocpress.render.default-locale=${BLOCPRESS_DEFAULT_LOCALE:de-DE}

# --- GraalVM Native Image ---
# Sprachdaten fuer DecimalFormatSymbols/DateTimeFormatter ins Native-Image einbinden. Ohne diese
# Einstellung enthaelt das Image nur die Build-Locale; alle anderen Sprachen fallen stillschweigend
# auf das Root-/en-Format zurueck (Regression 2.5.0: 500,000 statt 500.000). Wirkt nur im Native-Build.
quarkus.locales=all
# commons-compress (via odfdom) referenziert optionale Codecs (zstd, brotli, ...),
# deren native Libs nicht im Classpath sind. ODT nutzt nur ZIP/Deflate, daher die
# optionalen Compressor-Klassen erst zur Laufzeit initialisieren.
quarkus.native.additional-build-args=--initialize-at-run-time=org.apache.commons.compress.compressors

# Security-Header (REQ-0067)
quarkus.http.header."X-Content-Type-Options".value=nosniff
